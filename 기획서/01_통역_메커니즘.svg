<svg xmlns="http://www.w3.org/2000/svg" width="700" viewBox="0 0 700 360" role="img" aria-label="실시간 강의 통역 메커니즘: 교수자 한 명의 강의가 Gemini Live API를 거쳐 여러 언어의 수강생에게 전달되고 질문은 역방향으로 흐른다">
<style>
text{font-family:-apple-system,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",sans-serif;}
.title{font-size:15px;font-weight:600;fill:#2C2C2A;}
.th{font-size:14px;font-weight:500;fill:#2C2C2A;}
.ts{font-size:12px;fill:#5F5E5A;}
.tealth{font-size:14px;font-weight:500;fill:#085041;}
.teals{font-size:12px;fill:#0F6E56;}
.grh{font-size:14px;font-weight:500;fill:#3B3B38;}
.grs{font-size:12px;fill:#5F5E5A;}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8C8B83" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="700" height="360" fill="#FFFFFF"/>
<text class="title" x="24" y="32">그림 1. 실시간 강의 통역 메커니즘 — 화자 1명 → 다언어 청취자</text>

<rect x="260" y="72" width="180" height="52" rx="10" fill="#F1EFE8" stroke="#C9C7BD" stroke-width="0.8"/>
<text class="grh" x="350" y="93" text-anchor="middle">교수자 (화자)</text>
<text class="grs" x="350" y="111" text-anchor="middle">한 가지 언어로 강의</text>

<line x1="350" y1="124" x2="350" y2="160" stroke="#8C8B83" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/>

<rect x="250" y="160" width="200" height="52" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
<text class="tealth" x="350" y="181" text-anchor="middle">Gemini Live API</text>
<text class="teals" x="350" y="199" text-anchor="middle">실시간 다국어 변환</text>

<line x1="350" y1="212" x2="350" y2="248" stroke="#8C8B83" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/>

<rect x="70" y="248" width="560" height="72" rx="10" fill="#FAFAF7" stroke="#C9C7BD" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="th" x="86" y="271">수강생 — 각자 원하는 언어로 청취</text>
<rect x="86" y="286" width="120" height="30" rx="7" fill="#F1EFE8" stroke="#C9C7BD" stroke-width="0.8"/>
<text class="ts" x="146" y="305" text-anchor="middle">한국어</text>
<rect x="222" y="286" width="120" height="30" rx="7" fill="#F1EFE8" stroke="#C9C7BD" stroke-width="0.8"/>
<text class="ts" x="282" y="305" text-anchor="middle">中文</text>
<rect x="358" y="286" width="120" height="30" rx="7" fill="#F1EFE8" stroke="#C9C7BD" stroke-width="0.8"/>
<text class="ts" x="418" y="305" text-anchor="middle">English</text>
<rect x="494" y="286" width="120" height="30" rx="7" fill="#F1EFE8" stroke="#C9C7BD" stroke-width="0.8"/>
<text class="ts" x="554" y="305" text-anchor="middle">Tiếng Việt</text>

<text class="ts" x="350" y="344" text-anchor="middle">① 강의: 화자 → 학생 각자 언어로     ② 질문: 학생 → 화자 언어로 역통역</text>
</svg>
