<svg xmlns="http://www.w3.org/2000/svg" width="700" viewBox="0 0 700 414" role="img" aria-label="교수자 실시간 화면 구성: 상단바, 내 음성 인식, 수강생 언어 분포와 들어온 질문 2분할, 하단 컨트롤">
<style>
text{font-family:-apple-system,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",sans-serif;}
.title{font-size:15px;font-weight:600;fill:#2C2C2A;}
.zone{font-size:14px;font-weight:600;fill:#2C2C2A;}
