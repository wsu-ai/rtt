<svg xmlns="http://www.w3.org/2000/svg" width="700" viewBox="0 0 700 180" role="img" aria-label="과목 용어집 파이프라인: 용어집 등록에서 통역 주입, 일관된 캡션, 복습 단어장까지 4단계 흐름">
<style>
text{font-family:-apple-system,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",sans-serif;}
.title{font-size:15px;font-weight:600;fill:#2C2C2A;}
.grh{font-size:14px;font-weight:500;fill:#3B3B38;}
.grs{font-size:12px;fill:#5F5E5A;}
.tealh{font-size:14px;font-weight:500;fill:#085041;}
.teals{font-size:12px;fill:#0F6E56;}
.cap{font-size:12px;fill:#5F5E5A;}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8C8B83" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="700" height="180" fill="#FFFFFF"/>
<text class="title" x="24" y="32">그림 3. 과목 용어집 파이프라인</text>

<rect x="30" y="66" width="130" height="64" rx="10" fill="#F1EFE8" stroke="#C9C7BD" stroke-width="0.8"/>
<text class="grh" x="95" y="90" text-anchor="middle">용어집 등록</text>
<text class="grs" x="95" y="110" text-anchor="middle">교수·학과 입력</text>

<line x1="166" y1="98" x2="194" y2="98" stroke="#8C8B83" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="200" y="66" width="130" height="64" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
<text class="tealh" x="265" y="90" text-anchor="middle">통역에 주입</text>
<text class="teals" x="265" y="110" text-anchor="middle">모델 컨텍스트</text>

<line x1="336" y1="98" x2="364" y2="98" stroke="#8C8B83" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="370" y="66" width="130" height="64" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
<text class="tealh" x="435" y="90" text-anchor="middle">일관된 캡션</text>
<text class="teals" x="435" y="110" text-anchor="middle">용어 통일·강조</text>

<line x1="506" y1="98" x2="534" y2="98" stroke="#8C8B83" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="540" y="66" width="130" height="64" rx="10" fill="#F1EFE8" stroke="#C9C7BD" stroke-width="0.8"/>
<text class="grh" x="605" y="90" text-anchor="middle">복습·단어장</text>
<text class="grs" x="605" y="110" text-anchor="middle">저장·퀴즈</text>

<text class="cap" x="350" y="160" text-anchor="middle">청록색 단계가 핵심 — 용어집이 주입돼야 정(情)이 매번 같은 용어로 번역됨</text>
</svg>
